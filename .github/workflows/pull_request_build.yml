name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc

      - name: Show mops & moc versions
        run: |
          mops --version
          $(mops toolchain bin moc) --version

      - name: Prettier Check
        run: |
          npm install prettier prettier-plugin-motoko --no-save
          npx prettier --plugin prettier-plugin-motoko --check '**/*.{mo,json,md}'

      - name: Run tests
        run: mops test

      - name: Build example
        working-directory: ./example
        run: |
          mops install
          $(mops toolchain bin moc) $(mops sources) main.mo --idl -o icrc84_example.wasm

      - name: Make bin directory
        run: mkdir -p /home/runner/bin

      - name: Get didc
        run: |
          release=$(curl --silent "https://api.github.com/repos/dfinity/candid/releases/latest" | awk -F\" '/tag_name/ { print $4 }')
          if [[ "$release" == didc-v* ]]; then
            curl -fsSL "https://github.com/dfinity/candid/releases/download/$release/didc-x86_64-unknown-linux-gnu.tar.xz" | tar -xJ --strip-components=1 -C /home/runner/bin didc-x86_64-unknown-linux-gnu/didc
          else
            curl -fsSL "https://github.com/dfinity/candid/releases/download/$release/didc-linux64" > /home/runner/bin/didc
          fi
          chmod +x /home/runner/bin/didc
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Check did file of example
        working-directory: ./example
        run: |
          didc check icrc84_example.did did/icrc-84.did
